[project]
name = "local-image-gen-benchmark"
version = "0.1.0"
description = "CLI benchmark for local text-to-image diffusion models"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "contract: CLI contract tests",
]

[tool.coverage.run]
source = ["imagebench"]

[tool.coverage.report]
show_missing = true
fail_under = 60
