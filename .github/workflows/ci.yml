name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check app.py domain.py benchmark_runner.py orchestrator.py resource_monitor.py outputs.py

      - name: Syntax check
        run: python -m py_compile app.py domain.py benchmark_runner.py orchestrator.py resource_monitor.py outputs.py

      - name: Pytest with coverage
        run: pytest --cov=app --cov=domain --cov=benchmark_runner --cov=orchestrator --cov=resource_monitor --cov=outputs --cov-report=term-missing --cov-fail-under=60

      - name: Validate example config
        run: python app.py validate --config config.example.json

      - name: Report smoke test
        run: python app.py report --input tests/fixtures/sample_results.jsonl --output results/report_ci.md
